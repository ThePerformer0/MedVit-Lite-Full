# ============================================================
# MedViT-Lite — Base Configuration
# ============================================================

project:
  name: "MedViT-Lite"
  description: "Hierarchical Adaptive Transformer for Medical Diagnosis"
  version: "1.0.0"
  seed: 42

# ─── Dataset ────────────────────────────────────────────────
data:
  dataset: "chestmnist"          # "chestmnist" | "nih_chestxray"
  data_root: "./data/raw"
  image_size: 224                # resize target
  num_classes: 14                # 14 pathologies (NIH / ChestMNIST)
  num_workers: 8
  pin_memory: true

  # Splits
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

  # Augmentation
  augmentation:
    horizontal_flip: true
    random_rotation: 15          # degrees
    color_jitter: true
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std:  [0.229, 0.224, 0.225]

# ─── Model ──────────────────────────────────────────────────
model:
  name: "medvit_lite"

  # Patch configuration
  patch_size: 16                 # pixels per patch side → (224/16)² = 196 patches
  embed_dim: 384                 # embedding dimension (smaller = plus léger)
  depth: 6                       # number of Transformer blocks

  # Dynamic Patch Sparsifier (DPS)
  sparsifier:
    enabled: true
    keep_ratio: 0.5              # garder 50% des patches → 98 patches actifs
    scorer_hidden_dim: 128
    temperature: 1.0             # pour Gumbel-Softmax

  # Selective Frame Cache (SFC)
  frame_cache:
    enabled: true
    cache_size: 4                # nombre de frames mémorisées
    similarity_threshold: 0.92  # cosine similarity au-delà duquel on réutilise
    update_strategy: "lru"       # least-recently-used

  # Hierarchical Temporal Attention (HTA)
  attention:
    num_heads: 6
    local_window_size: 7         # attention locale (intra-frame)
    dropout: 0.1
    attn_dropout: 0.1

  # Classification Head
  head:
    hidden_dim: 256
    dropout: 0.3
    use_uncertainty: true        # Monte Carlo Dropout pour incertitude
    mc_samples: 10               # nombre de passes MC à l'inférence

# ─── Training ───────────────────────────────────────────────
training:
  epochs: 50
  batch_size: 64                 # par GPU (×4 GPUs = 256 effective)
  gradient_accumulation: 1

  optimizer:
    name: "adamw"
    lr: 3.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.999]

  scheduler:
    name: "cosine_warmup"
    warmup_epochs: 5
    min_lr: 1.0e-6

  loss:
    name: "bce_with_logits"      # multi-label classification
    pos_weight: null             # calculé dynamiquement si null

  # Multi-GPU
  distributed: true
  num_gpus: 4                    # c4130 : 4× V100

  # Mixed precision
  amp: true                      # Automatic Mixed Precision (fp16)

  # Early stopping
  early_stopping:
    patience: 10
    monitor: "val_auc"
    mode: "max"

# ─── Evaluation ─────────────────────────────────────────────
evaluation:
  metrics:
    - "auc_roc"
    - "sensitivity_at_specificity_95"
    - "f1_score"
    - "average_precision"
  threshold: 0.5                 # classification threshold

# ─── Explainability ─────────────────────────────────────────
explainability:
  method: "gradcam_plus_plus"    # "gradcam_plus_plus" | "attention_rollout"
  target_layer: "attention.norm2"
  generate_every_n_epochs: 5

# ─── Logging ────────────────────────────────────────────────
logging:
  use_wandb: true
  project: "medvit-lite"
  log_every_n_steps: 10
  save_dir: "./checkpoints"
  results_dir: "./results"
