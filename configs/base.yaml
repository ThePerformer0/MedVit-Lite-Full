# ============================================================
# MedViT-Lite — Base Configuration
# ============================================================


project:
  name: "MedViT-Lite"
  description: "Hierarchical Adaptive Transformer for Medical Diagnosis"
  version: "1.0.0"
  seed: 42

# ─── Dataset ────────────────────────────────────────────────
data:
  dataset: "chestmnist"          # Auto-download via medmnist (~200 Mo)
  data_root: "/kaggle/working/data/raw"
  image_size: 224
  num_classes: 14
  num_workers: 2                 # Kaggle = 4 CPUs, mais 2 évite les fuites RAM
  pin_memory: false              # Désactivé pour éviter les fuites RAM (OOM) sur Kaggle

  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

  augmentation:
    horizontal_flip: true
    random_rotation: 15
    color_jitter: true
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std:  [0.229, 0.224, 0.225]

# ─── Model ──────────────────────────────────────────────────
model:
  name: "medvit_lite"
  patch_size: 16
  embed_dim: 384
  depth: 6

  sparsifier:
    enabled: true
    keep_ratio: 0.5
    scorer_hidden_dim: 128
    temperature: 1.0

  frame_cache:
    enabled: true
    cache_size: 4
    similarity_threshold: 0.92
    update_strategy: "lru"

  attention:
    num_heads: 6
    local_window_size: 7
    dropout: 0.1
    attn_dropout: 0.1

  head:
    hidden_dim: 256
    dropout: 0.3
    use_uncertainty: true
    mc_samples: 10

# ─── Training ───────────────────────────────────────────────
training:
  epochs: 50
  batch_size: 32                 # T4 16Go : 32 par GPU (×2 = 64 effectif)
  gradient_accumulation: 2       # Simule batch_size=64 par GPU

  optimizer:
    name: "adamw"
    lr: 3.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.999]

  scheduler:
    name: "cosine_warmup"
    warmup_epochs: 5
    min_lr: 1.0e-6

  loss:
    name: "bce_with_logits"
    pos_weight: null

  # Multi-GPU
  distributed: true
  num_gpus: 2                    

  # Mixed precision (T4 a d'excellentes perf fp16)
  amp: true

  early_stopping:
    patience: 10
    monitor: "val_auc"
    mode: "max"

# ─── Evaluation ─────────────────────────────────────────────
evaluation:
  metrics:
    - "auc_roc"
    - "sensitivity_at_specificity_95"
    - "f1_score"
    - "average_precision"
  threshold: 0.5

# ─── Explainability ─────────────────────────────────────────
explainability:
  method: "gradcam_plus_plus"
  target_layer: "attention.norm2"
  generate_every_n_epochs: 10    # Moins fréquent pour économiser le temps

# ─── Logging ────────────────────────────────────────────────
logging:
  use_wandb: false               # Désactivé (pas besoin de clé API)
  project: "medvit-lite"
  log_every_n_steps: 10
  save_dir: "/kaggle/working/checkpoints"
  results_dir: "/kaggle/working/results"
